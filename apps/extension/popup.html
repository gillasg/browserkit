<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 14px;
    font:
      13px/1.45 system-ui,
      sans-serif;
    color: #e5e7eb;
    background: #17181c;
  }
  b {
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
  }

    margin: 14px 0 4px;

    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #9ca3af;
  }
  p {
    margin: 0;
  }
  .on {
    color: #4ade80;

  .off {

  }

    opacity: 0.6;
